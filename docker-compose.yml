# The container has to run on the same machine as Claude Code: it reads the
# session files off that machine's disk. Mounted read-only — this only ever reads.
#
# Run it from WSL, where the Windows home shows up under /mnt/c:
#
#   cd /mnt/c/Users/<you>/Documents/Data/Projek/SakoOffice
#   npm run build                      the image ships dist/, it does not build it
#   docker compose up --build          then open http://localhost:8081
#
# Machine-specific paths live in a .env file next to this one (gitignored):
#
#   CLAUDE_HOME=/mnt/c/Users/<you>/.claude
#   SAKO_WORKSPACE=C:\Users\<you>\Documents\Data\Projek\SakoOffice
#
# CLAUDE_HOME defaults to $HOME/.claude, which is right for Docker on plain
# Linux or macOS but not for WSL, where Claude Code runs on the Windows side.
#
# SAKO_WORKSPACE is a *Windows* path on purpose: it is matched against the `cwd`
# Claude Code writes into its session files, which is the path as Windows sees
# it. Get it wrong and the office still works — no session just claims the main
# desk.

services:
  sako-office:
    build: .
    ports:
      - '8081:8081'
    volumes:
      - ${CLAUDE_HOME:-${HOME}/.claude}:/claude:ro
    environment:
      # Must match the container side of the port mapping above.
      PORT: '8081'
      SAKO_CLAUDE_DIR: /claude
      SAKO_WORKSPACE: ${SAKO_WORKSPACE:-}
      # Host pids do not exist in here, so liveness comes from file age instead.
      SAKO_CHECK_PIDS: '0'
    restart: unless-stopped
